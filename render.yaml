databases:
  - name: landing-studio-db
    plan: free

services:
  - type: web
    name: landing-studio
    runtime: python
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: alembic upgrade head && python -m backend.seed_demo && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: gpt-oss
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: landing-studio-db
          property: connectionString
